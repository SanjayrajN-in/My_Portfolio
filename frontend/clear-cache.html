<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Clearing Cache | Sanjayraj N</title>
    <style>
        body {
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 30px;
            background-color: rgba(20, 20, 20, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        h1 {
            color: #00ffff;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .progress {
            width: 100%;
            height: 20px;
            background-color: #222;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #0088ff);
            transition: width 0.5s ease;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(90deg, #00ffff, #0088ff);
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .status {
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clearing Website Cache</h1>
        <p>We're clearing your browser's cache for this website to ensure you see the latest version.</p>
        <div class="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="status" id="status">Initializing cache clearing process...</div>
        <a href="index.html" class="btn" id="home-btn">Go to Homepage</a>
    </div>

    <script>
        // Aggressive cache clearing function
        function clearAllCaches() {
            // Update status
            const status = document.getElementById('status');
            const progressBar = document.getElementById('progress-bar');
            const homeBtn = document.getElementById('home-btn');
            
            // Step 1: Clear localStorage
            status.textContent = "Clearing local storage...";
            progressBar.style.width = "20%";
            localStorage.clear();
            
            setTimeout(() => {
                // Step 2: Clear sessionStorage
                status.textContent = "Clearing session storage...";
                progressBar.style.width = "40%";
                sessionStorage.clear();
                
                setTimeout(() => {
                    // Step 3: Clear application cache
                    status.textContent = "Clearing application cache...";
                    progressBar.style.width = "60%";
                    
                    if (window.applicationCache) {
                        try {
                            window.applicationCache.swapCache();
                        } catch (e) {
                            console.log('Application cache swap failed, but that\'s okay');
                        }
                    }
                    
                    setTimeout(() => {
                        // Step 4: Clear Cache API caches
                        status.textContent = "Clearing browser caches...";
                        progressBar.style.width = "80%";
                        
                        if ('caches' in window) {
                            caches.keys().then(cacheNames => {
                                return Promise.all(
                                    cacheNames.map(cacheName => {
                                        return caches.delete(cacheName);
                                    })
                                );
                            }).then(() => {
                                finishClearingProcess();
                            }).catch(err => {
                                console.warn('Cache clearing error:', err);
                                finishClearingProcess();
                            });
                        } else {
                            finishClearingProcess();
                        }
                    }, 500);
                }, 500);
            }, 500);
            
            // Final step
            function finishClearingProcess() {
                status.textContent = "Cache cleared successfully! You can now visit the homepage.";
                progressBar.style.width = "100%";
                homeBtn.style.opacity = "1";
                
                // Add timestamp to homepage URL
                homeBtn.href = "index.html?clearedCache=true&t=" + new Date().getTime();
            }
        }
        
        // Start the process when page loads
        window.addEventListener('load', clearAllCaches);
    </script>
</body>
</html>
